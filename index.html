<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Age Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="calculator-card">
            <h1>Age Calculator</h1>
            <p class="subtitle">Discover your exact age</p>
            
            <div class="input-group">
                <label for="birthDate">Date of Birth</label>
                <input 
                    type="date" 
                    id="birthDate" 
                    max=""
                >
            </div>

            <button class="calculate-btn" onclick="calculateAge()">Calculate Age</button>

            <div id="result" class="result hidden">
                <div class="result-item">
                    <span class="label">Years</span>
                    <span class="value" id="years">0</span>
                </div>
                <div class="result-item">
                    <span class="label">Months</span>
                    <span class="value" id="months">0</span>
                </div>
                <div class="result-item">
                    <span class="label">Days</span>
                    <span class="value" id="days">0</span>
                </div>
            </div>

            <div id="details" class="details hidden">
                <div class="detail-row">
                    <span class="detail-label">Total Days Lived:</span>
                    <span class="detail-value" id="totalDays">0</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Total Hours:</span>
                    <span class="detail-value" id="totalHours">0</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Next Birthday:</span>
                    <span class="detail-value" id="nextBirthday">-</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Day of Week Born:</span>
                    <span class="detail-value" id="dayOfWeek">-</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Zodiac Sign:</span>
                    <span class="detail-value" id="zodiac">-</span>
                </div>
            </div>

            <div id="error" class="error hidden"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
